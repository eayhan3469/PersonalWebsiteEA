<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Egemen Ayhan</title>
  <meta name="robots" content="noindex" />
  <script>try{var t=localStorage.getItem("ea-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else if(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
  <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .nf {
      min-height: 100vh;
      display: grid;
      place-content: center;
      gap: 1rem;
      text-align: left;
      padding: var(--gutter);
      max-width: var(--container);
      margin-inline: auto;
    }
    .nf-code {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--accent);
    }
    .nf-code::before { content: "// "; color: var(--text-faint); }
    .nf h1 {
      font-family: var(--font-display);
      font-size: clamp(3rem, 14vw, 7rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      margin: 0;
    }
    .nf p {
      color: var(--text-muted);
      max-width: 44ch;
      margin: 0;
    }
    .nf-actions {
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
      margin-top: 0.6rem;
    }
  </style>
</head>
<body>
  <main class="nf">
    <span class="nf-code">404 — not found</span>
    <h1>Dead link.</h1>
    <p>This page doesn't exist, moved, or never shipped. Head back to the start.</p>
    <div class="nf-actions">
      <a class="btn btn-primary" href="/">Home</a>
      <a class="btn btn-ghost" href="/#work">View work</a>
    </div>
  </main>
</body>
</html>
